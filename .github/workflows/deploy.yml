name: DevOps Dashboard CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend
        working-directory: backend
        run: npm install

      - name: Install Frontend
        working-directory: frontend
        run: npm install

      - name: Build React
        working-directory: frontend
        run: npm run build

      - name: Copy React Build
        shell: powershell
        run: |
          Remove-Item backend\dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path backend\dist
          Copy-Item frontend\dist\* backend\dist -Recurse -Force

      - name: Restart Backend
        working-directory: backend
        shell: powershell
        run: |
          pm2 restart devops-backend

      - name: Deployment Finished
        run: echo "Deployment completed successfully!"